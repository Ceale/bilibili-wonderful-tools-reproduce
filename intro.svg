<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 240" width="660" height="240" role="img" aria-label="工程文件见 release 处">
  <defs>
    <!-- 柔和渐变底 -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#9FB6E4"/>
      <stop offset="35%"  stop-color="#B7B2E3"/>
      <stop offset="70%"  stop-color="#D4AFD3"/>
      <stop offset="100%" stop-color="#EFC0C6"/>
    </linearGradient>

    <!-- 左上柔光 -->
    <radialGradient id="glowTop" cx="26%" cy="16%" r="78%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- 右下暗角，增加层次但不抢眼 -->
    <radialGradient id="glowBottom" cx="86%" cy="92%" r="72%">
      <stop offset="0%"   stop-color="#7C86D8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#7C86D8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 背景 -->
  <rect width="660" height="240" rx="28" fill="url(#bg)"/>
  <rect width="660" height="240" rx="28" fill="url(#glowTop)"/>
  <rect width="660" height="240" rx="28" fill="url(#glowBottom)"/>

  <!-- 两行文本 -->
  <g fill="#FFFFFF" fill-opacity="0.9"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif"
     font-weight="700" font-size="36" text-anchor="middle">
    <text x="285" y="110">工程文件见</text>
    <text x="285" y="158">release 处</text>
  </g>

  <!-- 朝向右上方的箭头 -->
  <g stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="7"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="400" y1="165" x2="480" y2="85"/>
    <polyline points="437,85 480,85 480,128"/>
  </g>
</svg>
